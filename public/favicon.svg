<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy rounded background -->
  <rect width="64" height="64" rx="14" fill="#1a2332"/>
  <!-- Gold "R" built from shapes (no font needed) -->
  <!-- Left vertical bar -->
  <rect x="13" y="11" width="9" height="42" rx="2" fill="#c9a84c"/>
  <!-- Top cap -->
  <rect x="13" y="11" width="27" height="8" rx="2" fill="#c9a84c"/>
  <!-- Bowl right side -->
  <rect x="31" y="11" width="8" height="24" rx="2" fill="#c9a84c"/>
  <!-- Bowl bottom -->
  <rect x="13" y="27" width="26" height="8" rx="2" fill="#c9a84c"/>
  <!-- Leg (diagonal) -->
  <polygon points="25,35 35,35 51,53 40,53" fill="#c9a84c"/>
</svg>
